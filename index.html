<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Spectrum Pro Management</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        /* Optimized System Font Stack for Offline Use */
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji", "Segoe UI Symbol";
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 10px;
      }
      .dark {
        background-color: #0f1115;
        color: #f3f4f6;
      }

      /* Remove Number Input Spinners globally */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* Off-screen holder for SimpleBookReportPage (screen + PDF capture) */
      #print-mount {
        position: fixed;
        left: -10000px;
        top: 0;
        z-index: -1;
        pointer-events: none;
      }

      /* Standardized Print/PDF Engine — voucher lives in #print-mount (outside #root) */
      @media print {
        @page {
          size: A4;
          margin: 0;
        }

        html,
        body {
          background: white !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Hide the React app; print only the mounted report (reliable in WebView2) */
        #root {
          display: none !important;
        }

        #print-mount {
          position: static !important;
          left: auto !important;
          top: auto !important;
          width: 100% !important;
          height: auto !important;
          z-index: auto !important;
          pointer-events: auto !important;
          display: block !important;
          overflow: visible !important;
        }

        #print-mount .spectrum-offscreen-print-source {
          position: static !important;
          width: 100% !important;
          display: block !important;
        }

        .print-container {
          position: relative !important;
          left: auto !important;
          top: auto !important;
          width: 210mm !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          padding: 12mm 11mm !important;
          background: white !important;
          color: #111827 !important;
          display: block !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .print-container * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        main,
        [role="dialog"] {
          overflow: visible !important;
        }

        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }

        .no-print,
        button,
        .modal-controls,
        nav,
        header {
          display: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "@tauri-apps/plugin-sql": "https://esm.sh/@tauri-apps/plugin-sql@^2.3.2",
          "dexie": "https://esm.sh/dexie@^4.3.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.575.0",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
          "framer-motion": "https://esm.sh/framer-motion@^12.34.3",
          "recharts": "https://esm.sh/recharts@^3.7.0",
          "jspdf": "https://esm.sh/jspdf@^4.2.0",
          "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
          "mongoose": "https://esm.sh/mongoose@^9.2.0",
          "express": "https://esm.sh/express@^5.2.1",
          "vite": "https://esm.sh/vite@^7.3.1",
          "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
        }
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 transition-colors duration-300">
    <div id="root"></div>
    <div id="print-mount" aria-hidden="true"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
